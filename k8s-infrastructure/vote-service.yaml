apiVersion: v1
kind: Service
metadata:
  name: vote-service
  labels:
    app: vote-service
spec:
  ports:
    - port: 8083
      targetPort: 8083
  selector:
    app: vote-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote-service
  labels:
    app: vote-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vote-service
  template:
    metadata:
      labels:
        app: vote-service
    spec:
      containers:
        - name: vote-service
          image: votosync-vote-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: DB_MASTER_HOST
              value: "postgres-master"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "postgres"
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: IDENTITY_SERVICE_URL
              value: "http://identity-service:8081"
            - name: ELECTION_SERVICE_URL
              value: "http://election-service:8082"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vote-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vote-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    # 1. CPU-based scaling
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # 2. Custom metric scaling based on RabbitMQ queue size (vote buffering backup)
    - type: External
      external:
        metric:
          name: rabbitmq_queue_messages_ready
          selector:
            matchLabels:
              queue: vote-ingestion-queue
        target:
          type: Value
          averageValue: "50" # Scale up if there are more than 50 messages ready in queue per pod
